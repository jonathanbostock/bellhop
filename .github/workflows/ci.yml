name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Offline suite only — the live provider suites are opt-in and billed
      # (LAMBDA_LIVE / NEBIUS_LIVE / RUNPOD_LIVE / MODAL_LIVE).
      - run: uv sync --extra dev
      - run: uv run pytest -q
